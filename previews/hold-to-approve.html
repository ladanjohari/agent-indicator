<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hold to approve, preview scene</title>
    <style>
      /* One shared 7 second timeline. Every animated element uses the same
         duration and schedules itself with percentages, so the capture script
         can step currentTime once and have everything stay in sync.

         6.2s at 20fps is 124 frames.

           0.00s   0%      the gate, with the delete already open
           0.80s   12.9%   cursor starts moving
           1.30s   21.0%   a quick click lands
           1.45s   23.4%   released, the fill snaps back, nothing happens
           2.20s   35.5%   the hold begins
           3.40s   54.8%   1.2 seconds later, it completes
           3.50s   56.4%   approved, and the request is taken away
           3.57s   57.5%   the full bar is allowed to land
           3.81s   61.5%   nothing left waiting, the gate leaves
           5.70s   92.0%   rest
           6.20s   100%    reset for the loop
      */

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        width: 560px;
        height: 320px;
        background: #f7f6f3;
        color: #111111;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 14px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
        position: relative;
      }

      .scene {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }

      /* The component's own styles, copied exactly from ApprovalGate.css. */
      .agent-gate {
        animation: resolve 6.2s linear infinite both;
        --agent-gate-rule: color-mix(in srgb, currentColor 12%, transparent);
        --agent-gate-quiet: color-mix(in srgb, currentColor 60%, transparent);
        --agent-gate-fill: color-mix(in srgb, currentColor 6%, transparent);
        --agent-gate-danger: #ff3b30;
        width: 400px;
        border: 1px solid var(--agent-gate-rule);
        border-radius: 14px;
        padding: 16px;
        background: #f7f6f3;
      }

      .agent-gate__head {
        display: flex; align-items: baseline; justify-content: space-between;
        gap: 16px; margin-bottom: 14px;
      }
      .agent-gate__title { font-size: 14px; font-weight: 500; }
      .agent-gate__dismiss {
        font-size: 13px; color: var(--agent-gate-quiet);
        text-decoration: underline; text-underline-offset: 3px;
      }
      .agent-gate__list { list-style: none; display: grid; gap: 10px; }
      .agent-gate__item { display: grid; gap: 4px; }
      .agent-gate__consequence { display: block; }
      .agent-gate__detail {
        display: block;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px; color: var(--agent-gate-quiet);
      }
      /* Only when there is a batched group above to separate it from, which
         matches the component since 16 August 2026. */
      .agent-gate__group + .agent-gate__group--destructive {
        margin-top: 18px; padding-top: 16px;
        border-top: 1px solid var(--agent-gate-rule);
      }
      .agent-gate__note { margin-bottom: 12px; font-size: 12px; color: var(--agent-gate-danger); }
      .agent-gate__note[data-tone='caution'] { color: var(--agent-gate-quiet); }
      .agent-gate__reveal {
        display: flex; align-items: baseline; justify-content: space-between;
        gap: 12px; width: 100%; text-align: left;
      }
      .agent-gate__reveal-hint {
        flex: none; font-size: 12px; color: var(--agent-gate-quiet);
        text-decoration: underline; text-underline-offset: 3px;
      }
      .agent-gate__revealed {
        position: relative;
        margin-top: 8px; padding-left: 12px;
        border-left: 2px solid color-mix(in srgb, var(--agent-gate-danger) 40%, transparent);
      }
      .agent-gate__actions { display: flex; gap: 8px; margin-top: 14px; }

      .agent-gate__hold {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        font: inherit;
        font-size: 13px;
        padding: 7px 15px;
        border-radius: 999px;
        border: 1px solid color-mix(in srgb, var(--agent-gate-danger) 55%, transparent);
        color: var(--agent-gate-danger);
        animation: press 6.2s linear infinite both;
      }
      .agent-gate__hold-fill {
        position: absolute; inset: 0; z-index: -1;
        background: color-mix(in srgb, var(--agent-gate-danger) 18%, transparent);
        animation: fill 6.2s linear infinite both;
      }
      .agent-gate__hold-label { position: relative; }

      .agent-gate__deny {
        font-size: 13px; padding: 7px 15px; border-radius: 999px;
        border: 1px solid var(--agent-gate-rule);
      }

      .cursor {
        position: absolute;
        width: 18px; height: 18px;
        pointer-events: none;
        animation: cursor 6.2s linear infinite both;
      }
      .cursor svg { display: block; }

      /* The fill. This is the only thing in the scene that must be exact: it
         holds at empty, snaps back from the aborted click, then sweeps across
         in precisely 1.2 of the 6.2 seconds, linearly. */
      @keyframes fill {
        0%,     21%  { clip-path: inset(0 100% 0 0); animation-timing-function: linear; }
        /* The aborted click. Wide enough to actually see start, so the retreat
           reads as "that did nothing" rather than as nothing happening. */
        23.3%          { clip-path: inset(0 80% 0 0); animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1); }
        26.5%,  35.5%  { clip-path: inset(0 100% 0 0); animation-timing-function: linear; }
        /* The hold: 1.2 seconds of the 6.2, linear, no easing, because it
           maps to real elapsed time. */
        54.8%,  62%    { clip-path: inset(0 0 0 0); }
        /* Emptied while the gate is gone, so the loop never shows a full red
           button snapping back to nothing. */
        64%,    100%   { clip-path: inset(0 100% 0 0); }
      }

      @keyframes press {
        0%,     20.9%  { transform: scale(1); }
        21%,  23.3%  { transform: scale(0.97); }
        23.4%,  35.3%  { transform: scale(1); }
        35.5%,  54.8%  { transform: scale(0.97); }
        55%,  100%   { transform: scale(1); }
      }

      /* The gate leaves once the request is answered, because that is what
         actually happens: the host drops the request and nothing is left
         waiting. The component itself never reports an outcome it does not
         own. Opacity is 1 at both 0% and 100%, so the loop does not seam. */
      @keyframes resolve {
        0%,     57.5%  { opacity: 1; }
        61.5%,  92%    { opacity: 0; }
        98%,    100%   { opacity: 1; }
      }

      /* The cursor arrives, taps once, waits, then presses and stays down. */
      @keyframes cursor {
        0%,   9%    { transform: translate(370px, 262px); opacity: 0; }
        12.9%       { transform: translate(370px, 262px); opacity: 1; }
        20.9%       { transform: translate(168px, 212px); opacity: 1; }
        21%, 23.3% { transform: translate(168px, 214px); opacity: 1; }
        23.4%, 35.3% { transform: translate(168px, 212px); opacity: 1; }
        35.5%, 54.8%   { transform: translate(168px, 214px); opacity: 1; }
        /* The hand relaxes away once it is done, then leaves with the gate
           rather than drifting across an empty frame. */
        57.1%,  57.5%  { transform: translate(258px, 246px); opacity: 1; }
        61.5%,  100%   { transform: translate(258px, 246px); opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <section class="agent-gate">
        <header class="agent-gate__head">
          <p class="agent-gate__title">Waiting for you</p>
          <span class="agent-gate__dismiss">Not now</span>
        </header>

        <div class="agent-gate__group agent-gate__group--destructive">
          <p class="agent-gate__note" data-tone="alarm">This cannot be undone. Open it to answer.</p>
          <ul class="agent-gate__list">
            <li class="agent-gate__item" data-reversible="false">
              <div class="agent-gate__reveal">
                <span class="agent-gate__consequence">Deletes the legacy folder and everything in it</span>
                <span class="agent-gate__reveal-hint">Close</span>
              </div>
              <div class="agent-gate__revealed">
                <code class="agent-gate__detail">rm -rf legacy</code>
                <div class="agent-gate__actions">
                  <span class="agent-gate__hold">
                    <span class="agent-gate__hold-fill"></span>
                    <span class="agent-gate__hold-label">Hold to approve</span>
                  </span>
                  <span class="agent-gate__deny">Deny</span>
                </div>
              </div>
            </li>
          </ul>
        </div>
      </section>
    </div>

    <div class="cursor">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M2 1.5 L2 14 L5.4 10.9 L7.7 15.8 L10 14.7 L7.8 10 L12.4 9.7 Z"
              fill="#111" stroke="#fff" stroke-width="1.1" stroke-linejoin="round"/>
      </svg>
    </div>
  </body>
</html>
